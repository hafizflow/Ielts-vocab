<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>IELTS Word Lab</title>
    <meta name="claude:viewport-fit-sides" content="cover">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <style>
        /* Layout: a study notebook. Header with progress, sticky toolbar (mode tabs + search), filter rows, a tile grid; each word opens a full detail sheet. Highlighter yellow is the one bold move. Icons are Lucide (ISC), inlined as a sprite. */
        :root {
            --bg: #F2F5FB;
            --surface: #FFFFFF;
            --surface2: #E8EDF7;
            --ink: #101B33;
            --muted: #56637F;
            --line: #D5DDEC;
            --marker: #FFE14D;
            --syn: #0B7A64;
            --synbg: #DDF3EC;
            --ant: #BE3B27;
            --antbg: #FBE3DE;
            --warn: #A65F00;
            --warnbg: #FDF0D9;
            --btn: #101B33;
            --btn-ink: #F2F5FB;
            --focus: #2F4BFF;
            --scrim: rgba(8, 12, 26, .55);
            --on-marker: #101B33;
            --info: #1F4FD1;
            --infobg: #E6EDFF;
            --vio: #6B3FC9;
            --viobg: #F0E9FF;
            --shadow: 0 1px 2px rgba(16, 27, 51, .06), 0 4px 14px rgba(16, 27, 51, .06);
            --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
            --f-body: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
            --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0B1122;
                --surface: #131B33;
                --surface2: #1B2542;
                --ink: #EAF0FF;
                --muted: #9CA9C9;
                --line: #27325A;
                --marker: rgba(255, 225, 77, .4);
                --syn: #52D9B5;
                --synbg: #12362F;
                --ant: #FF9A86;
                --antbg: #40201B;
                --warn: #FFC24D;
                --warnbg: #3A2C10;
                --btn: #EAF0FF;
                --btn-ink: #0B1122;
                --focus: #8EA2FF;
                --scrim: rgba(0, 0, 0, .65);
                --on-marker: #FFE98A;
                --info: #8EA9FF;
                --infobg: #18234A;
                --vio: #C3A8FF;
                --viobg: #261C44;
                --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0B1122;
            --surface: #131B33;
            --surface2: #1B2542;
            --ink: #EAF0FF;
            --muted: #9CA9C9;
            --line: #27325A;
            --marker: rgba(255, 225, 77, .4);
            --syn: #52D9B5;
            --synbg: #12362F;
            --ant: #FF9A86;
            --antbg: #40201B;
            --warn: #FFC24D;
            --warnbg: #3A2C10;
            --btn: #EAF0FF;
            --btn-ink: #0B1122;
            --focus: #8EA2FF;
            --scrim: rgba(0, 0, 0, .65);
            --on-marker: #FFE98A;
            --info: #8EA9FF;
            --infobg: #18234A;
            --vio: #C3A8FF;
            --viobg: #261C44;
            --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
            color-scheme: dark;
        }

        * {
            box-sizing: border-box
        }

        html {
            scrollbar-gutter: stable
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font: 400 15px/1.6 var(--f-body);
            margin: 0;
            padding-block: 0 56px;
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px))
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: env(safe-area-inset-top, 0px);
            z-index: 60;
            background: var(--bg)
        }

        button,
        input {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent
        }

        button:disabled {
            cursor: default
        }

        :focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px
        }

        .wrap {
            max-width: 1080px;
            margin: 0 auto
        }

        .ic {
            width: 1.15em;
            height: 1.15em;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            vertical-align: -.2em
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap
        }

        .mono {
            font-family: var(--f-mono);
            font-size: 12px;
            letter-spacing: .04em
        }

        kbd {
            display: inline-block;
            min-width: 1.7em;
            padding: 0 .4em;
            border: 1px solid var(--line);
            border-bottom-width: 2px;
            border-radius: 4px;
            background: var(--surface);
            font: 500 11px/1.6 var(--f-mono);
            text-align: center;
            color: var(--ink)
        }

        /* header */
        .top {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 32px;
            align-items: flex-end;
            justify-content: space-between;
            padding-block: 24px 18px
        }

        .brand {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            min-width: 0;
            flex: 1 1 420px
        }

        .logo {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--marker);
            color: var(--on-marker);
            font-size: 26px;
            flex: none;
            margin-top: 2px
        }

        h1 {
            margin: 0;
            font: 800 clamp(30px, 6vw, 46px)/1 var(--f-display);
            letter-spacing: -.025em;
            text-wrap: balance
        }

        .mk {
            background: linear-gradient(transparent 60%, var(--marker) 60%);
            padding: 0 .08em
        }

        .brand p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
            max-width: 54ch
        }

        .side {
            display: flex;
            gap: 14px;
            align-items: flex-end;
            flex: 0 1 340px;
            min-width: 260px
        }

        .prog {
            flex: 1;
            min-width: 0
        }

        .pnum {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font: 500 13px var(--f-mono);
            color: var(--muted)
        }

        .pnum b {
            font: 700 28px var(--f-display);
            letter-spacing: -.02em;
            color: var(--ink)
        }

        .pnum .pct {
            margin-left: auto
        }

        .pbar {
            display: flex;
            height: 8px;
            background: var(--surface2);
            border-radius: 4px;
            overflow: hidden;
            margin: 6px 0 6px
        }

        .pbar i {
            display: block;
            height: 100%;
            width: 0
        }

        .pbar .k {
            background: var(--syn)
        }

        .pbar .l {
            background: var(--warn)
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            font-size: 13px;
            color: var(--muted)
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 5px
        }

        .legend .k .ic {
            color: var(--syn)
        }

        .legend .l .ic {
            color: var(--warn)
        }

        .iconbtn {
            display: inline-grid;
            place-items: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 10px;
            font-size: 18px;
            flex: none
        }

        .iconbtn:hover:not(:disabled) {
            border-color: var(--ink)
        }

        .iconbtn:disabled {
            opacity: .35
        }

        /* toolbar */
        .bar {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 20;
            background: var(--bg);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding-block: 10px;
            border-bottom: 1px solid var(--line)
        }

        .tabs {
            display: inline-flex;
            gap: 2px;
            padding: 3px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface)
        }

        .tabs button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 0;
            background: none;
            border-radius: 9px;
            padding: 8px 14px;
            font-weight: 600;
            color: var(--muted)
        }

        .tabs button:hover {
            color: var(--ink)
        }

        .tabs button[aria-pressed="true"] {
            background: var(--btn);
            color: var(--btn-ink)
        }

        .search {
            position: relative;
            flex: 1 1 240px;
            min-width: 0;
            display: flex;
            align-items: center
        }

        .search>.ic {
            position: absolute;
            left: 12px;
            color: var(--muted);
            pointer-events: none
        }

        .search input {
            width: 100%;
            height: 44px;
            padding: 0 74px 0 40px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface)
        }

        .search input:focus {
            border-color: var(--focus);
            outline: none;
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent)
        }

        .search input::-webkit-search-cancel-button {
            display: none
        }

        .search input::placeholder {
            color: var(--muted)
        }

        .search .sx {
            position: absolute;
            right: 6px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .search .clr {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border: 0;
            background: var(--surface2);
            border-radius: 8px;
            padding: 0
        }

        @media (max-width:560px) {
            .tabs {
                width: 100%
            }

            .tabs button {
                flex: 1;
                justify-content: center;
                padding: 9px 6px
            }

            .search kbd {
                display: none
            }

            .search input {
                padding-right: 44px
            }
        }

        /* filters */
        .filters {
            display: grid;
            gap: 10px;
            padding: 14px 0 16px
        }

        .frow {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            min-width: 0
        }

        .flab {
            flex: 0 0 64px;
            padding-top: 9px;
            font: 500 11px var(--f-mono);
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted)
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-width: 0;
            flex: 1
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 38px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface);
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap
        }

        .chip:hover {
            border-color: var(--ink)
        }

        .ring {
            --p: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex: none;
            background: conic-gradient(var(--syn) calc(var(--p) * 1%), var(--surface2) 0);
            -webkit-mask: radial-gradient(circle, transparent 4px, #000 4.5px);
            mask: radial-gradient(circle, transparent 4px, #000 4.5px)
        }

        .chip small {
            font: 400 11px var(--f-mono);
            color: var(--muted)
        }

        .chip[aria-pressed="true"] {
            background: var(--btn);
            color: var(--btn-ink);
            border-color: var(--btn)
        }

        .chip[aria-pressed="true"] small {
            color: inherit;
            opacity: .75
        }

        .chip[aria-pressed="true"] .ring {
            background: conic-gradient(var(--marker) calc(var(--p) * 1%), color-mix(in srgb, var(--btn-ink) 25%, transparent) 0)
        }

        .seg {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .seg button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 38px;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 999px;
            padding: 0 14px;
            font-size: 14px
        }

        .seg button:hover {
            border-color: var(--ink)
        }

        .seg button small {
            font: 400 11px var(--f-mono);
            color: var(--muted)
        }

        .seg button[data-v="k"] .ic {
            color: var(--syn)
        }

        .seg button[data-v="l"] .ic {
            color: var(--warn)
        }

        .seg button[aria-pressed="true"] {
            background: var(--btn);
            color: var(--btn-ink);
            border-color: var(--btn)
        }

        .seg button[aria-pressed="true"] small,
        .seg button[aria-pressed="true"] .ic {
            color: inherit
        }

        @media (max-width:640px) {
            .frow {
                flex-direction: column;
                gap: 6px
            }

            .flab {
                flex: none;
                padding-top: 0
            }

            .chips,
            .seg {
                flex-wrap: nowrap;
                overflow-x: auto;
                width: calc(100% + 32px);
                margin: 0 -16px;
                padding: 2px 16px 4px;
                scrollbar-width: none
            }

            .chips::-webkit-scrollbar,
            .seg::-webkit-scrollbar {
                display: none
            }

            .seg button {
                flex: none
            }
        }

        .scope {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 0 0 12px;
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--surface2);
            font-size: 13.5px;
            line-height: 1.5
        }

        .scope .ic {
            color: var(--muted);
            margin-top: .15em
        }

        .scope b {
            font-weight: 600
        }

        /* browse */
        .wotd {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            text-align: left;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: var(--shadow);
            padding: 14px 16px;
            margin-bottom: 18px
        }

        .wotd:hover {
            border-color: var(--ink)
        }

        .wotd .glyph {
            width: 52px;
            height: 52px;
            font-size: 24px;
            margin: 0
        }

        .wtxt {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1
        }

        .wotd .lab {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font: 500 11px var(--f-mono);
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted)
        }

        .wotd .ww {
            font: 700 24px/1.2 var(--f-display);
            letter-spacing: -.01em
        }

        .wotd .wbn {
            color: var(--muted);
            overflow-wrap: anywhere
        }

        .wotd .go {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
            flex: none
        }

        .wotd:hover .go {
            color: var(--ink)
        }

        .count {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px 16px;
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 10px
        }

        .count b {
            color: var(--ink);
            font-weight: 600
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px
        }

        @media (max-width:560px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 8px
            }

            .tile {
                padding: 12px
            }

            .tw {
                font-size: 17px
            }
        }

        .tile {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            text-align: left;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface)
        }

        .tile:hover {
            border-color: var(--ink);
            box-shadow: var(--shadow)
        }

        .tile:hover .tw {
            background: linear-gradient(transparent 60%, var(--marker) 60%)
        }

        .tw {
            font: 700 19px/1.2 var(--f-display);
            letter-spacing: -.01em;
            overflow-wrap: anywhere;
            align-self: flex-start;
            padding-right: 22px
        }

        .tp {
            font: 400 11px var(--f-mono);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .05em
        }

        .tb {
            font-size: 15px;
            color: var(--ink);
            overflow-wrap: anywhere
        }

        .tst {
            position: absolute;
            top: 13px;
            right: 13px;
            font-size: 17px;
            line-height: 0
        }

        .tile[data-s="k"] .tst {
            color: var(--syn)
        }

        .tile[data-s="l"] .tst {
            color: var(--warn)
        }

        .tile[data-s="k"] {
            border-left: 3px solid var(--syn)
        }

        .tile[data-s="l"] {
            border-left: 3px solid var(--warn)
        }

        .empty {
            display: grid;
            justify-items: center;
            gap: 10px;
            padding: 48px 16px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--line);
            border-radius: 14px
        }

        .empty>.ic {
            font-size: 32px;
            color: var(--muted)
        }

        .empty p {
            margin: 0;
            max-width: 42ch
        }

        /* generic buttons */
        .btn,
        .ghost {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            border-radius: 10px;
            padding: 0 18px;
            font-weight: 600
        }

        .btn {
            border: 1px solid var(--btn);
            background: var(--btn);
            color: var(--btn-ink)
        }

        .btn:hover:not(:disabled) {
            filter: brightness(1.15)
        }

        .btn:disabled {
            opacity: .4
        }

        .ghost {
            border: 1px solid var(--line);
            background: var(--surface);
            font-weight: 500
        }

        .ghost:hover {
            border-color: var(--ink)
        }

        .ghost.sm {
            min-height: 38px;
            padding: 0 12px;
            font-size: 14px
        }

        .ghost[aria-pressed="true"] {
            border-color: var(--ink);
            box-shadow: inset 0 0 0 1px var(--ink)
        }

        .ghost.ok[aria-pressed="true"] {
            background: var(--synbg);
            color: var(--syn);
            border-color: var(--syn);
            box-shadow: none
        }

        .ghost.lrn[aria-pressed="true"] {
            background: var(--warnbg);
            color: var(--warn);
            border-color: var(--warn);
            box-shadow: none
        }

        .linkbtn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 0;
            background: none;
            padding: 4px 0;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-color: var(--line)
        }

        .linkbtn:hover {
            text-decoration-color: currentColor
        }

        /* detail sheet: wide two-column dialog; each section is a tinted box so the eye can find it by colour */
        .sheet {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: stretch;
            background: var(--scrim)
        }

        .panel {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            width: 100%;
            max-width: 1180px;
            overflow: auto;
            overscroll-behavior: contain;
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (min-width:820px) {
            .sheet {
                padding: 24px;
                align-items: center
            }

            .panel {
                max-height: 100%;
                border-radius: 18px;
                box-shadow: 0 24px 60px rgba(0, 0, 0, .28)
            }
        }

        .ptop {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
            background: var(--surface);
            border-bottom: 1px solid var(--line)
        }

        @media (min-width:820px) {
            .ptop {
                padding: 10px 20px
            }
        }

        .ptop .where {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .ptop .nav {
            display: flex;
            gap: 6px;
            flex: none
        }

        .navbtn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 38px;
            max-width: 190px;
            padding: 0 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600
        }

        .navbtn span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .navbtn:hover:not(:disabled) {
            border-color: var(--ink);
            background: var(--surface2)
        }

        .navbtn:disabled {
            opacity: .35
        }

        .ptop .iconbtn {
            width: 38px;
            height: 38px
        }

        @media (max-width:620px) {
            .navbtn {

        .hero {

        }

        .hero .glyph {

        }

        .dh {

        }

        .box {
            --tone: var(--muted);
            --tint: var(--surface2);
            min-width: 0;
            padding: 12px 14px 14px;
            border-radius: 14px;
            background: var(--tint);

        }

        .box.syn {
            --tone: var(--syn);
            --tint: var(--synbg)
        }

        .box.ant {
            --tone: var(--ant);
            --tint: var(--antbg)
        }

        .box.use {
            --tone: var(--vio);
            --tint: var(--viobg)
        }

        .box.sen {
            --tone: var(--info);
            --tint: var(--infobg)
        }

        .box h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 10px;
            font: 600 12px var(--f-mono);
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--tone)
        }

        .box h3 .ic {
            display: grid;
            place-items: center;
            width: 24px;
            height: 24px;
            padding: 4px;
            border-radius: 7px;
            background: var(--tone);

        }

        .box ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .box .none {

        }

        .chipw {
            display: inline-flex;
            align-items: center;

            border-radius: 999px;
            font-size: 15px;

        .chipw.s {
            background: var(--synbg);
            color: var(--syn)
        }

        .chipw.a {
            background: var(--antbg);
            color: var(--ant)
        }

        .box .chipw {
            background: var(--surface);
            color: var(--tone);
            box-shadow: 0 1px 2px rgba(0, 0, 0, .06);

        }

        button.chipw {
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: transparent;
            text-underline-offset: 3px
        }

        button.chipw:hover {
            text-decoration-color: currentColor
        }

        button.chipw .ic {
            font-size: 12px;
            opacity: .7
        }

        .glyph {
            display: grid;
            place-items: center;
            width: 84px;
            height: 84px;
            margin: 0 auto 6px;
            border-radius: 50%;
            background: var(--marker);
            color: var(--on-marker);

            flex: none
        }

        .glyph .ic {
            stroke-width: 1.75
        }

        .rep li {
            padding: 3px 12px;
            border-radius: 999px;
            background: var(--surface);
            color: var(--tone);
            font-size: 15px;
            font-weight: 500;

        }

        .ctx {

        }

            margin: 0;

        }

        .sents li {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 4px 10px;
            align-items: baseline;
            background: var(--surface);
            border-radius: 10px;
            padding: 9px 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .06)
        }

        .sents p {

            font-size: 15.5px;
            line-height: 1.5;

        .tag {

            align-items: center;
            gap: 4px;

            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap
        }

        .tag.ie {
            background: var(--info);
            color: var(--surface)
        }

        .tag.rl {
            background: var(--surface2);
            color: var(--ink)
        }

        mark {
            background: var(--marker);

        @media (max-width:520px) {
            .sents li {

            .sents .tag {

        /* flashcards */
        .fchead {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between
        }

        .fchead .tools {
            display: flex;
            gap: 6px
        }

        .fcbar {
            height: 6px;
            background: var(--surface2);
            border-radius: 3px;
            margin: 10px 0 14px;
            overflow: hidden
        }

        .fcbar i {
            display: block;
            height: 100%;
            background: var(--ink);
            border-radius: 3px
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 300px;
            padding: 36px 20px 24px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow)
        }

        .card:hover {
            border-color: var(--ink)
        }

        .card .side-lab {
            position: absolute;
            top: 14px;
            left: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font: 500 11px var(--f-mono);
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted)
        }

        .card .glyph {
            margin-bottom: 4px
        }

        .card .cw {
            font: 800 clamp(38px, 9vw, 60px)/1.05 var(--f-display);
            letter-spacing: -.025em;
            overflow-wrap: anywhere;
            background: linear-gradient(transparent 62%, var(--marker) 62%)
        }

        .card .cw.sm {
            font-size: 22px
        }

        .card .hint {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            margin-top: 12px
        }

        .card .cbn {
            font: 600 clamp(26px, 6vw, 34px)/1.3 var(--f-body)
        }

        .card .cen {
            color: var(--muted);
            font-size: 17px;
            max-width: 52ch
        }

        .card .cex {
            max-width: 54ch;
            font-size: 16px;
            border-top: 1px dashed var(--line);
            padding-top: 12px;
            margin-top: 6px
        }

        .card .csyn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--syn)
        }

        .fcact {
            display: grid;
            grid-template-columns: auto 1fr 1fr;
            gap: 10px;
            margin-top: 14px
        }

        .fcact .btn.alt {
            background: var(--warnbg);
            color: var(--warn);
            border-color: var(--warn)
        }

        .fcact .btn.go {
            background: var(--syn);
            border-color: var(--syn);
            color: #fff
        }

        :root[data-theme="dark"] .fcact .btn.go {
            color: #0B1122
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .fcact .btn.go {
                color: #0B1122
            }
        }

        .kb {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 16px;
            color: var(--muted);
            font-size: 13px;
            margin-top: 12px
        }

        .kb span {
            display: inline-flex;
            align-items: center;
            gap: 5px
        }

        @media (hover:none) {
            .kb {
                display: none
            }
        }

        /* quiz */
        .qwrap {
            max-width: 720px;
            margin: 0 auto
        }

        .qcard {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 22px 20px;
            box-shadow: var(--shadow)
        }

        .qhead {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px
        }

        .qhead .glyph {
            width: 48px;
            height: 48px;
            font-size: 22px;
            margin: 0
        }

        .qkind {
            display: flex;
            align-items: center;
            gap: 6px;
            font: 500 11px var(--f-mono);
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 8px
        }

        .qprompt {
            margin: 0 0 16px;
            font: 600 clamp(20px, 4.6vw, 26px)/1.35 var(--f-body);
            overflow-wrap: anywhere
        }

        .qprompt.big {
            font: 800 clamp(34px, 8vw, 48px)/1.1 var(--f-display);
            letter-spacing: -.02em
        }

        .opts {
            display: grid;
            gap: 8px
        }

        .opt {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            min-height: 52px;
            padding: 8px 14px 8px 10px;
            border: 1px solid var(--line);
            background: var(--bg);
            border-radius: 12px;
            font-size: 16.5px
        }

        .opt .ok {
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--surface);
            font: 500 13px var(--f-mono);
            flex: none
        }

        .opt .t {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere
        }

        .opt .res {
            font-size: 20px;
            line-height: 0
        }

        .opt:hover:not(:disabled) {
            border-color: var(--ink)
        }

        .opt:hover:not(:disabled) .ok {
            border-color: var(--ink)
        }

        .opt.right {
            background: var(--synbg);
            border-color: var(--syn);
            color: var(--syn);
            font-weight: 600
        }

        .opt.right .ok {
            background: var(--syn);
            border-color: var(--syn);
            color: var(--surface)
        }

        .opt.wrong {
            background: var(--antbg);
            border-color: var(--ant);
            color: var(--ant)
        }

        .opt.wrong .ok {
            background: var(--ant);
            border-color: var(--ant);
            color: var(--surface)
        }

        .opt.dim {
            opacity: .55
        }

        .explain {
            margin-top: 16px;
            padding: 14px;
            border-radius: 12px;
            background: var(--surface2)
        }

        .explain .verdict {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            margin: 0 0 6px
        }

        .explain .verdict.y {
            color: var(--syn)
        }

        .explain .verdict.n {
            color: var(--ant)
        }

        .explain p {
            margin: 0 0 12px
        }

        .explain .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px
        }

        .score {
            font: 800 64px/1 var(--f-display);
            letter-spacing: -.03em
        }

        .result {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 8px
        }

        .missed {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 12px 0 18px
        }

        .setup .row,
        .qcard .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0 0
        }

        .setup p {
            margin: 0;
            color: var(--muted)
        }

        .qtypes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 8px;
            margin: 14px 0 4px;
            padding: 0;
            list-style: none
        }

        .qtypes li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--surface2);
            font-size: 14px
        }

        .foot {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 40px;
            color: var(--muted);
            font-size: 13px
        }

        /* toast + back-to-top */
        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            z-index: 70;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: calc(100% - 32px);
            padding: 8px 8px 8px 14px;
            border-radius: 12px;
            background: var(--btn);
            color: var(--btn-ink);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
            font-size: 14px;
            opacity: 0;
            transform: translate(-50%, 16px);
            pointer-events: none;
            visibility: hidden
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
            pointer-events: auto;
            visibility: visible
        }

        .toast span {
            min-width: 0
        }

        .toast button {
            border: 0;
            border-radius: 8px;
            padding: 6px 12px;
            background: color-mix(in srgb, var(--btn-ink) 16%, transparent);
            color: inherit;
            font-weight: 700;
            flex: none
        }

        .toast button:hover {
            background: color-mix(in srgb, var(--btn-ink) 26%, transparent)
        }

        .totop {
            position: fixed;
            right: max(16px, env(safe-area-inset-right, 0px));
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            z-index: 30;
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            border: 0;
            border-radius: 50%;
            background: var(--btn);
            color: var(--btn-ink);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
            font-size: 20px;
            opacity: 0;
            transform: translateY(12px) scale(.9);
            pointer-events: none
        }

        .totop.show {
            opacity: 1;
            transform: none;
            pointer-events: auto
        }

        .card {
            touch-action: pan-y;
            -webkit-user-select: none;
            user-select: none
        }

        .card[data-drag="r"] {
            border-color: var(--syn);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--syn) 25%, transparent)
        }

        .card[data-drag="l"] {
            border-color: var(--warn);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent)
        }

        .swipehint {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            margin: 10px 0 0
        }

        @media (hover:none) {
            .swipehint {
                display: flex
            }
        }

        /* motion: enter with ease-out, leave with ease-in, all ≤ 300ms */
        @keyframes fadeIn {
            from {
                opacity: 0
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(.98)
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
        }

        @keyframes slideL {
            from {
                opacity: 0;
                transform: translateX(28px)
            }
        }

        @keyframes slideR {
            from {
                opacity: 0;
                transform: translateX(-28px)
            }
        }

        @keyframes flipIn {
            from {
                opacity: .3;
                transform: perspective(1000px) rotateY(-75deg)
            }
        }

        @keyframes dealIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.96)
            }
        }

        @keyframes shake {

            20%,
            60% {
                transform: translateX(-6px)
            }

            40%,
            80% {
                transform: translateX(6px)
            }
        }

        @keyframes pulseOk {
            from {
                box-shadow: 0 0 0 0 color-mix(in srgb, var(--syn) 50%, transparent)
            }

            to {
                box-shadow: 0 0 0 12px transparent
            }
        }

        @keyframes pop {
            50% {
                transform: scale(1.06)
            }
        }

        @keyframes ring {
            from {
                box-shadow: 0 0 0 0 color-mix(in srgb, var(--btn) 45%, transparent)
            }

            to {
                box-shadow: 0 0 0 12px transparent
            }
        }

        @media (prefers-reduced-motion:no-preference) {

            .btn,
            .ghost,
            .chip,
            .seg button,
            .tabs button,
            .iconbtn,
            .navbtn,
            .say,
            .opt,
            .tile,
            .linkbtn,
            .chipw,
            .wotd {
                transition: border-color .15s, box-shadow .15s, background-color .15s, color .15s, transform .12s ease-out
            }

            .btn:active:not(:disabled),
            .ghost:active,
            .chip:active,
            .seg button:active,
            .tabs button:active,
            .iconbtn:active:not(:disabled),
            .navbtn:active:not(:disabled),
            .say:active,
            .opt:active:not(:disabled),
            .wotd:active {
                transform: scale(.96)
            }

            .tile:hover {
                transform: translateY(-2px)
            }

            .tile:active {
                transform: scale(.98)
            }

            .card {
                transition: border-color .15s, box-shadow .15s, transform .2s ease-out, opacity .2s
            }

            .toast,
            .totop {
                transition: opacity .2s ease-out, transform .2s ease-out, visibility .2s
            }

            .sheet.in {
                animation: fadeIn .2s ease-out
            }

            .sheet.in .panel {
                animation: popIn .26s cubic-bezier(.2, .8, .2, 1)
            }

            .sheet.out {
                animation: fadeIn .16s ease-in reverse forwards
            }

            .sheet.out .panel {
                animation: popIn .16s ease-in reverse forwards
            }

            .dbody.nx {
                animation: slideL .22s ease-out
            }

            .dbody.pv {
                animation: slideR .22s ease-out
            }

            #main.viewin {
                animation: fadeUp .24s ease-out
            }

            .anim>* {
                animation: fadeUp .28s ease-out both;
                animation-delay: calc(var(--d, 0) * 22ms)
            }

            .card.deal {
                animation: dealIn .26s cubic-bezier(.2, .8, .2, 1)
            }

            .card.back {
                animation: slideR .24s ease-out
            }

            .card.flip {
                animation: flipIn .3s cubic-bezier(.2, .8, .2, 1)
            }

            .opt.shake {
                animation: shake .32s ease-in-out
            }

            .opt.pulse {
                animation: pulseOk .5s ease-out
            }

            .explain.rise {
                animation: fadeUp .24s ease-out
            }

            .pop {
                animation: pop .26s ease-out
            }

            .result .glyph {
                animation: popIn .3s cubic-bezier(.2, .8, .2, 1)
            }

            .say.speaking {
                animation: ring 1s ease-out infinite
            }
        }

        /* ===== responsive: phones get a bottom tab bar, collapsible filters and sticky actions; short screens get a compact header ===== */
        :root {
            --navh: 0px
        }

        .ftoggle,
        .dfoot,
        .t-touch {
            display: none
        }

        @media (hover:none) {
            .t-touch {
                display: inline
            }

            .t-mouse {
                display: none
            }
        }

        #main {
            scroll-margin-top: 80px
        }

        .card {
            min-height: clamp(220px, calc(100svh - 440px), 360px)
        }

        .fcact {
            position: sticky;
            bottom: calc(var(--navh) + 10px);
            z-index: 5;
            padding-top: 10px;
            background: linear-gradient(transparent, var(--bg) 35%)
        }

        #qnext {
            scroll-margin-bottom: calc(var(--navh) + 20px)
        }

        .toast {
            bottom: calc(var(--navh) + 16px + env(safe-area-inset-bottom, 0px))
        }

        .totop {
            bottom: calc(var(--navh) + 16px + env(safe-area-inset-bottom, 0px))
        }

        /* touch screens: bigger targets */
        @media (pointer:coarse) {

            .chip,
            .seg button {
                height: 42px
            }

            .ghost.sm,
            .navbtn {
                min-height: 42px;
                height: 42px
            }

            .ptop .iconbtn,
            .say {
                width: 42px;
                height: 42px
            }
        }

        /* tablets and small laptops */
        @media (max-width:1024px) and (min-width:641px) {
            .brand {
                flex-basis: 360px
            }
        }

        /* large screens use the extra room */
        @media (min-width:1440px) {
            .wrap {
                max-width: 1240px
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))
            }
        }

        /* short screens (landscape phones, small laptops) */
        @media (max-height:560px) and (min-width:641px) {
            #main {
                scroll-margin-top: 8px
            }

            .top {
                padding-block: 10px 8px;
                align-items: center
            }

            .brand p {
                display: none
            }

            .logo {
                width: 40px;
                height: 40px;
                font-size: 20px;
                border-radius: 11px;
                margin: 0
            }

            h1 {
                font-size: 28px
            }

            .bar {
                position: static
            }

            .filters {
                gap: 6px;
                padding: 8px 0 10px
            }

            .scope {
                display: none
            }

            .sheet {
                padding: 8px
            }

            .hero {
                grid-template-columns: 1fr auto;
                padding: 10px 14px
            }

            .hero .glyph {
                display: none
            }

            .dbody {
                padding: 10px 16px 14px;
                gap: 10px
            }

            .ptop {
                padding-block: 6px
            }

            .card {
                min-height: 200px;
                padding-block: 26px 14px
            }

            .card .glyph {
                width: 56px;
                height: 56px;
                font-size: 26px
            }

            .qcard {
                padding: 14px 16px
            }

            .qprompt {
                margin-bottom: 10px
            }

            .opt {
                min-height: 44px
            }
        }

        @media (max-height:860px) and (min-width:641px) {
            .qprompt.big {
                font-size: clamp(28px, 5vw, 40px)
            }

            .opts {
                gap: 6px
            }

            .opt {
                min-height: 46px
            }
        }

        /* phones and short screens: filters collapse behind a summary button */
        @media (max-width:640px),
        (max-height:560px) {
            .ftoggle {
                display: flex;
                align-items: center;
                gap: 8px;
                width: 100%;
                min-height: 46px;
                margin-top: 10px;
                padding: 0 12px 0 14px;
                border: 1px solid var(--line);
                border-radius: 12px;
                background: var(--surface);
                text-align: left;
                font-size: 14px
            }

            .ftoggle .fs {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap
            }

            .ftoggle .fs b {
                font-weight: 600
            }

            .ftoggle .badge {
                display: grid;
                place-items: center;
                min-width: 22px;
                height: 22px;
                padding: 0 6px;
                border-radius: 999px;
                background: var(--btn);
                color: var(--btn-ink);
                font: 600 12px var(--f-mono)
            }

            .ftoggle .chev {
                color: var(--muted)
            }

            .ftoggle[aria-expanded="true"] .chev {
                transform: rotate(180deg)
            }

            .filters {
                padding: 10px 0 12px
            }

            .filters:not(.open) {
                display: none
            }

            .scope {
                display: none
            }

        }

        /* phones */
        @media (max-width:640px) {
            :root {
                --navh: calc(64px + env(safe-area-inset-bottom, 0px))
            }

            body {
                padding-bottom: calc(var(--navh) + 20px)
            }

            #main {
                scroll-margin-top: 12px
            }

            /* compact header */
            .top {
                gap: 10px;
                padding-block: 14px 8px;
                align-items: center
            }

            .brand {
                align-items: center;
                flex: 1 1 100%;
                gap: 10px
            }

            .brand p {
                display: none
            }

            .logo {
                width: 40px;
                height: 40px;
                font-size: 20px;
                border-radius: 11px;
                margin: 0
            }

            h1 {
                font-size: clamp(24px, 7.5vw, 30px)
            }

            .side {
                flex: 1 1 100%;
                min-width: 0;
                align-items: center
            }

            .pnum b {
                font-size: 22px
            }

            .pbar {
                height: 6px;
                margin: 4px 0
            }

            .legend {
                font-size: 12px;
                gap: 2px 10px
            }

            /* mode tabs become a bottom tab bar */
            .bar {
                padding-block: 8px;
                top: env(safe-area-inset-top, 0px)
            }

            .bar.bare {
                padding: 0;
                border: 0
            }

            .tabs {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 40;
                width: auto;
                gap: 4px;
                padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
                border: 0;
                border-top: 1px solid var(--line);
                border-radius: 0;
                background: color-mix(in srgb, var(--surface) 92%, transparent);
                -webkit-backdrop-filter: blur(14px);
                backdrop-filter: blur(14px);
                box-shadow: 0 -6px 18px rgba(0, 0, 0, .06)
            }

            .tabs button {
                flex: 1;
                flex-direction: column;
                justify-content: center;
                gap: 2px;
                min-height: 52px;
                padding: 4px;
                border-radius: 12px;
                font-size: 12px
            }

            .tabs button .ic {
                font-size: 21px
            }

            .tabs button[aria-pressed="true"] {
                background: color-mix(in srgb, var(--marker) 42%, transparent);
                color: var(--ink)
            }

            .search input {
                height: 46px
            }

            /* browse */
            .wotd {
                padding: 12px;
                gap: 12px;
                margin-bottom: 14px
            }

            .wotd .glyph {
                width: 44px;
                height: 44px;
                font-size: 20px
            }

            .wotd .ww {
                font-size: 20px
            }

            /* word dialog: status buttons move to a sticky bottom bar */
            .panel {
                padding-bottom: 0
            }

            .hero .stbar {
                display: none
            }

            .dfoot {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                position: sticky;
                bottom: 0;
                z-index: 2;
                margin-top: auto;
                padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
                background: var(--surface);
                border-top: 1px solid var(--line);
                box-shadow: 0 -6px 18px rgba(0, 0, 0, .06)
            }

            .dfoot .ghost {
                justify-content: center;
                min-height: 46px;
                padding: 0 8px
            }

            .dbody {
                gap: 12px;
                padding: 12px 16px 16px
            }

            .hero {
                gap: 4px 12px
            }

            .box {
                padding: 12px
            }

            .sents li {
                padding: 9px 10px
            }

            .sents p {
                font-size: 15px
            }

            /* flashcards */
            .card {
                min-height: clamp(210px, calc(100svh - 420px), 340px);
                padding: 30px 14px 18px;
                border-radius: 16px
            }

            .card .glyph {
                width: 64px;
                height: 64px;
                font-size: 28px
            }

            .card .cw {
                font-size: clamp(32px, 10vw, 44px)
            }

            .card .cbn {
                font-size: clamp(22px, 6.5vw, 28px)
            }

            .card .cen {
                font-size: 15.5px
            }

            .card .cex {
                font-size: 15px
            }

            .fcbar {
                margin: 8px 0 10px
            }

            .fcact {
                gap: 8px;
                padding-top: 8px;
                margin-top: 6px;
                background: linear-gradient(transparent, var(--bg) 30%)
            }

            .fcact .btn {
                padding: 0 8px;
                font-size: 15px;
                gap: 6px;
                min-height: 50px
            }

            .fcact .ghost {
                min-height: 50px;
                width: 50px;
                padding: 0
            }

            /* quiz */
            .qcard {
                padding: 16px 14px;
                border-radius: 14px
            }

            .qprompt {
                font-size: clamp(18px, 5vw, 21px);
                margin-bottom: 12px
            }

            .qprompt.big {
                font-size: clamp(28px, 9vw, 36px)
            }

            .opts {
                gap: 7px
            }

            .opt {
                min-height: 50px;
                font-size: 16px
            }

            .explain {
                padding: 12px
            }

            .explain .row {
                flex-direction: column-reverse;
                align-items: stretch
            }

            .explain .row .btn {
                width: 100%;
                min-height: 50px
            }

            .linkbtn {
                justify-content: center
            }

            .setup .row .btn,
            .qcard .row .btn,
            .qcard .row .ghost {
                flex: 1 1 100%
            }

            .score {
                font-size: 52px
            }

            .foot {
                margin-top: 28px;
                text-align: center
            }
        }

        /* small phones */
        @media (max-width:400px) {
            .lbl-wide {
                display: none
            }

            .fchead .tools .ghost.sm {
                width: 42px;
                padding: 0
            }

            .count .legend .hint-txt,
            .wotd .go .lbl-wide {
                display: none
            }

            .tw {
                font-size: 16.5px;
                padding-right: 18px
            }

            .tile {
                padding: 11px 11px 12px
            }

            .tst {
                top: 10px;
                right: 10px;
                font-size: 15px
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(132px, 1fr))
            }

            .hero {
                grid-template-columns: 1fr
            }

            .hero .glyph {
                display: none
            }

            .dh h2 {
                font-size: 30px
            }

            .ptop .where {
                font-size: 11px
            }

            .opt .ok {
                width: 26px;
                height: 26px
            }
        }

        @media (max-width:360px) {
            .fcact .btn .ic {
                display: none
            }

            .fcact .btn {
                font-size: 14px
            }
        }

        @media (max-width:640px) and (max-height:680px) {
            .top {
                padding-block: 10px 6px
            }

            .top .legend {
                display: none
            }

            .card {
                min-height: clamp(170px, calc(100svh - 380px), 300px);
                padding-top: 26px;
                gap: 4px
            }

            .card .glyph {
                width: 50px;
                height: 50px;
                font-size: 22px
            }

            .card .hint {
                margin-top: 6px
            }
        }

        .hide {
            display: none !important
        }

        @media (prefers-reduced-motion:no-preference) {

            .tile,
            .chip,
            .opt,
            .seg button,
            .ghost,
            .iconbtn,
            .wotd,
            .card {
                transition: border-color .15s, box-shadow .15s, background-color .15s
            }

            .pbar i,
            .fcbar i {
                transition: width .3s ease
            }
        }
    </style>
</head>

            }

                    case 'top': window.scrollTo({ top: 0, behavior: reduce() ? 'auto' : 'smooth' }); break;
                    case 'theme': prefs.theme = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', prefs.theme); savePrefs(); renderTheme(); break;
                    case 'open': openDetail(+b.dataset.i, b.classList.contains('tile') ? 'list' : b.dataset.nav); break;
                    case 'close': closeDetail(); break;
                    case 'prev': step(-1); break;
                    case 'next': step(1); break;
                    case 'speak': speak(b.dataset.t, b); break;
                    case 'setl': setStatus(S.detail, 'l'); break;
                    case 'setk': setStatus(S.detail, 'k'); break;
                    case 'flip': if (S.fc.noclick) { S.fc.noclick = false; break; } if (S.fc.busy) break; S.fc.flip = !S.fc.flip; S.fc.fx = 'flip'; renderCards(); break;
                    case 'again': fly(false); break;
                    case 'got': fly(true); break;
                    case 'shuf': newDeck(!S.fc.shuf); renderCards(); toast(S.fc.shuf ? 'Deck shuffled' : 'Back to list order', 'shuffle'); break;
                    case 'restart': newDeck(S.fc ? S.fc.shuf : false); renderCards(); break;
                    case 'qstart': startQuiz(+b.dataset.n); renderQuiz(); toMain(); break;
                    case 'qopt': answer(+b.dataset.k); break;
                    case 'qnext': { var Q2 = S.quiz; Q2.pos++; Q2.sel = -1; if (Q2.pos >= Q2.n) Q2.phase = 'end'; renderQuiz(); toMain(); break; }
                    case 'qnew': S.quiz = null; renderQuiz(); break;
                    case 'qmissed': { var ms = S.quiz.missed.map(function (i) { return DATA[i]; }); startQuiz(ms.length, ms); renderQuiz(); break; }
                }
            });
            document.addEventListener('keydown', function (e) {
                var t = e.target && e.target.tagName;
                if (e.metaKey || e.ctrlKey || e.altKey) return;
                if (S.detail >= 0) {
                    if (e.key === 'Escape') closeDetail();
                    else if (e.key === 'ArrowLeft') step(-1);
                    else if (e.key === 'ArrowRight') step(1);
                    return;
                }
                if (t === 'INPUT') return;
                if (e.key === '/' && S.mode === 'browse') { e.preventDefault(); document.getElementById('q').focus(); return; }
                if (S.mode === 'cards' && S.fc && S.fc.pos < S.fc.deck.length) {
                    if (e.key === '1' || e.key === '2') fly(e.key === '2');
                    else if (e.key === ' ' && t !== 'BUTTON' && !S.fc.busy) { e.preventDefault(); S.fc.flip = !S.fc.flip; S.fc.fx = 'flip'; renderCards(); }
                }
                if (S.mode === 'quiz' && S.quiz && S.quiz.phase === 'q') {
                    if (/^[1-9]$/.test(e.key)) answer(+e.key - 1);
                    else if (e.key === 'Enter' && S.quiz.sel >= 0 && t !== 'BUTTON') { var nb = document.getElementById('qnext'); if (nb) nb.click(); }
                }
            });

            shell(); renderAll();
        })();
    </script>
